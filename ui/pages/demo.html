<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlowGuard — Explore Demo Company</title>
  <meta name="description" content="FlowGuard demo sandbox — synthetic financial simulation with explicit isolation." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="../css/design-system.css" />
  <link rel="stylesheet" href="../css/motion.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <link rel="stylesheet" href="../css/demo.css" />
</head>
<body>
<div class="bg-mesh"></div>

<!-- PERSISTENT DEMO BANNER — always visible, cannot be dismissed -->
<div class="demo-banner" id="demo-banner" role="banner">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
    <line x1="12" y1="9" x2="12" y2="13"></line>
    <line x1="12" y1="17" x2="12.01" y2="17"></line>
  </svg>
  <span><strong>DEMO SANDBOX</strong> &mdash; This is an isolated synthetic simulation. All values are marked <strong>SIMULATED</strong>.</span>
  <a href="/" class="btn btn-sm" style="background:rgba(249,115,22,0.2);color:var(--clr-demo);border:1px solid rgba(249,115,22,0.3);margin-left:var(--sp-4)">&#x2190; Exit Demo</a>
</div>

<div class="dashboard-shell">
  <!-- Side nav -->
  <nav class="dashboard-nav" role="navigation">
    <div class="nav-logo">
      <div class="nav-logo-mark" aria-hidden="true">&#x1F6E1;</div>
      FlowGuard
    </div>
    <div style="padding:var(--sp-2) var(--sp-3);background:var(--clr-demo-bg);border-radius:var(--radius-md);border:1px solid rgba(249,115,22,0.2)">
      <div style="font-size:var(--text-xs);font-weight:700;color:var(--clr-demo);letter-spacing:0.06em">DEMO MODE</div>
      <div style="font-size:var(--text-xs);color:var(--text-muted);margin-top:2px">Acme Corp (Synthetic)</div>
    </div>
    <div>
      <div class="nav-section-label">Overview</div>
      <div class="nav-links">
        <a href="#" class="nav-link active"><span class="nav-icon">&#x1F4CA;</span> Control Center</a>
        <a href="#" class="nav-link"><span class="nav-icon">&#x1F4B0;</span> Cash Position</a>
        <a href="#" class="nav-link"><span class="nav-icon">&#x1F4C8;</span> Forecast Model</a>
        <a href="#" class="nav-link"><span class="nav-icon">&#x26A0;&#xFE0F;</span> Risk Signals</a>
      </div>
    </div>
    <div style="margin-top:auto">
      <div class="nav-links">
        <a href="/" class="nav-link"><span class="nav-icon">&#x1F6AA;</span> Exit Demo</a>
      </div>
    </div>
  </nav>

  <!-- Main -->
  <div style="display:flex;flex-direction:column;min-height:100vh">
    <header class="dashboard-topbar">
      <div class="topbar-title">Dashboard <span class="badge badge-simulated" style="margin-left:var(--sp-2)">SIMULATED DATA</span></div>
      <div class="topbar-right">
        <div class="topbar-org">
          <div class="org-avatar" style="background:linear-gradient(135deg,var(--clr-demo),#c2410c)">A</div>
          <span>Acme Corp (Demo)</span>
        </div>
        <a href="/pages/signup.html" class="btn btn-primary btn-sm">Create Real Account &rarr;</a>
      </div>
    </header>

    <main class="dashboard-content" id="demo-content">
      <div class="empty-state"><div class="spinner"></div></div>
    </main>
  </div>
</div>

<script type="module">
import { DEMO_TENANT_ID } from '../js/tenant.js';
import { getDemoTenantSnapshot, activateDemoMode } from '../js/onboarding/demo-mode.js';
import { Provenance } from '../js/provenance.js';

activateDemoMode();
const tenant  = getDemoTenantSnapshot();
const fin     = tenant?.financials ?? {};
const profile = tenant?.profile    ?? {};
const sources = tenant?.dataSources ?? [];
const risks   = tenant?.initialAssessment?.risks ?? [];
const cur     = profile.currency ?? 'INR';

document.getElementById('demo-content').innerHTML = `
  <!-- Sources bar -->
  <div class="data-sources-bar" style="margin-bottom:var(--sp-6)">
    ${sources.map(s => `
      <div class="source-pill">
        <span class="source-dot" style="background:var(--clr-demo)"></span>
        <span>${s.name}</span>
        <span class="badge badge-simulated" style="font-size:10px">SIMULATED</span>
      </div>
    `).join('')}
  </div>

  <!-- Notice banner -->
  <div class="alert alert-warning" style="margin-bottom:var(--sp-6);background:rgba(249,115,22,0.08);border-color:rgba(249,115,22,0.2)">
    <span>&#x1F52E;</span>
    <div style="color:var(--clr-demo)">All values below are <strong>SIMULATED</strong> &mdash; generated from an isolated synthetic sandbox dataset to showcase FlowGuard&rsquo;s automated detection. Zero connection to real financials.</div>
  </div>

  <!-- KPI row -->
  <div class="kpi-grid">
    ${renderDemoKpi('Available Cash',       fin.availableCash,        '&#x1F4B0;')}
    ${renderDemoKpi('Upcoming Obligations', fin.upcomingObligations,  '&#x1F4E4;')}
    ${renderDemoKpi('Receivables',          fin.receivables,           '&#x1F4E8;')}
    ${renderDemoKpi('30-Day Forecast',      fin.forecast30d,           '&#x1F4C8;')}
  </div>

  <!-- Charts row -->
  <div class="grid-2" style="margin-bottom:var(--sp-8)">
    <div class="chart-card">
      <div class="chart-header">
        <div class="chart-title">Cash Flow &middot; 7-Day Simulation</div>
        <span class="badge badge-simulated">Simulated</span>
      </div>
      <div class="chart-area">
        ${[0.55, 0.70, 0.65, 0.80, 0.75, 0.88, 1.0].map(h =>
          `<div class="chart-bar" style="height:${Math.round(h*100)}%;opacity:0.75;background:linear-gradient(to top,#f97316,#fb923c)"></div>`
        ).join('')}
      </div>
    </div>

    <!-- Risk panel -->
    <div class="chart-card">
      <div class="chart-header">
        <div class="chart-title">&#x26A0;&#xFE0F; Simulated Risk Alerts</div>
        <span class="badge badge-simulated">Simulated</span>
      </div>
      <div class="risk-list">
        ${risks.map(r => `
          <div class="risk-item">
            <div class="risk-severity ${r.severity}"></div>
            <div class="risk-content">
              <div class="risk-title">${r.title}</div>
              <div class="risk-detail" style="color:var(--clr-demo);font-size:11px;margin-top:2px">SIMULATED SIGNAL &middot; ${r.detail || ''}</div>
            </div>
            <div class="risk-meta">
              <div class="risk-amount" style="color:var(--clr-${r.severity==='high'?'danger':r.severity==='medium'?'warning':'success'})">${capitalize(r.severity)}</div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  </div>

  <!-- Context from demo profile -->
  <div class="chart-card">
    <div class="chart-header">
      <div class="chart-title">&#x1F4CB; Demo Sandbox Profile</div>
      <span class="badge badge-simulated">Simulated</span>
    </div>
    <div class="grid-3" style="gap:var(--sp-4)">
      ${ctxItem('Organization', profile.organizationName)}
      ${ctxItem('Industry', profile.industry)}
      ${ctxItem('Payroll / cycle', fmtCur(profile.payrollAmount, cur))}
      ${ctxItem('Payroll schedule', capitalize(profile.payrollSchedule))}
      ${ctxItem('Min. buffer', fmtCur(profile.minimumLiquidityBuffer, cur))}
      ${ctxItem('Receivable terms', `Net ${profile.receivableTermsDays}`)}
    </div>
  </div>

  <!-- CTA to start real onboarding -->
  <div style="margin-top:var(--sp-8);text-align:center;padding:var(--sp-10);background:rgba(42,155,130,0.06);border:1px solid rgba(42,155,130,0.2);border-radius:var(--radius-xl)">
    <div style="font-size:var(--text-2xl);margin-bottom:var(--sp-3);font-family:var(--font-serif)">Ready to see your company&rsquo;s real numbers?</div>
    <div style="color:var(--text-secondary);margin-bottom:var(--sp-6);max-width:500px;margin-left:auto;margin-right:auto">Set up FlowGuard with your actual financial data and get deterministic early warnings.</div>
    <a href="/pages/signup.html" class="btn btn-primary btn-lg">&#x1F680; Start With Real Data</a>
  </div>
`;

function renderDemoKpi(label, metric, icon) {
  const isNoData = !metric?.reliable || metric?.value === null;
  const formatted = isNoData ? 'Not enough data' : fmtCur(metric.value, cur);
  return `
    <div class="kpi-card" style="border-color:rgba(249,115,22,0.25)">
      <div class="kpi-header">
        <div class="kpi-label">${icon} ${label}</div>
        <span class="badge badge-simulated">Simulated</span>
      </div>
      <div class="kpi-value ${isNoData ? 'no-data' : ''}" style="${isNoData?'':'-webkit-text-fill-color:unset;background:none;color:var(--clr-demo)'}">${formatted}</div>
      <div class="kpi-footer">
        <div style="font-size:var(--text-xs);color:var(--clr-demo);opacity:0.8">&#x26A0;&#xFE0F; SIMULATED</div>
        <div class="kpi-freshness">synthetic</div>
      </div>
    </div>
  `;
}

function ctxItem(label, value) {
  return `
    <div style="padding:var(--sp-3);background:rgba(249,115,22,0.04);border-radius:var(--radius-md);border:1px solid rgba(249,115,22,0.12)">
      <div style="font-size:var(--text-xs);color:var(--clr-demo);opacity:0.8;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px">${label}</div>
      <div style="font-size:var(--text-sm);font-weight:600">${value ?? '—'}</div>
    </div>
  `;
}

function fmtCur(val, cur = 'INR') {
  if (val == null) return '—';
  return new Intl.NumberFormat('en-IN', { style: 'currency', currency: cur, maximumFractionDigits: 0 }).format(val);
}
function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1).replace(/-/g,' ') : '—'; }
</script>
</body>
</html>
